name: Bug report
description: Report reproducible incorrect behavior in a sample
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve the KitchenPC samples.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: dropdown
    id: sample
    attributes:
      label: Sample
      options:
        - React Web App
        - Shopping List TUI
        - Database Initializer
        - Sample Data
        - Repository or documentation
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest sequence of steps that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the .NET and Node.js versions, operating system, database, and other relevant details.
